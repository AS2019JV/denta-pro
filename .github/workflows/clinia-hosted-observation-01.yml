name: Clinia hosted observation offline proposal
on:
  push:
    branches: [codex/clinia-hosted-observation-01]
permissions:
  contents: read
jobs:
  metadata-proposal-offline:
    runs-on: windows-2025
    timeout-minutes: 5
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
      - name: Verify frozen proposal inputs and deployment exclusion
        run: node docs/production/evidence/2026-10-31-gate3-hosted-observation/verify-ci-inputs.cjs
      - name: Exercise metadata protocol and negative cases offline
        run: node --test docs/production/evidence/2026-10-31-gate3-hosted-observation/observation.test.cjs
      - name: Scan public tracked source without values
        run: node scripts/clinia-secret-scan.cjs
